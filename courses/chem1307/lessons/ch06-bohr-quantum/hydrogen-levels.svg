<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"><title>Hydrogen levels and emission</title><desc>Schematic parallels show hydrogen energy levels from n equals 1 to 5 and the zero-energy ionization limit. A downward arrow runs from n equals 4 to 2.</desc><rect x="0" y="0" width="720" height="330" fill="#ffffff" /><line x1="94" y1="288" x2="94" y2="39" stroke="#18344c" stroke-width="1.5" /><line x1="94" y1="39" x2="90" y2="45" stroke="#18344c" stroke-width="1.5" /><line x1="94" y1="39" x2="98" y2="45" stroke="#18344c" stroke-width="1.5" /><text x="24" y="42" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="400">Energy</text><line x1="138" y1="280" x2="478" y2="280" stroke="#117788" stroke-width="2" /><text x="488" y="284" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">n = 1</text><line x1="138" y1="155" x2="478" y2="155" stroke="#117788" stroke-width="2" /><text x="488" y="159" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">n = 2</text><line x1="138" y1="103" x2="478" y2="103" stroke="#117788" stroke-width="2" /><text x="488" y="107" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">n = 3</text><line x1="138" y1="74" x2="478" y2="74" stroke="#117788" stroke-width="2" /><text x="488" y="78" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">n = 4</text><line x1="138" y1="50" x2="478" y2="50" stroke="#117788" stroke-width="2" /><text x="488" y="54" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">n = 5</text><line x1="138" y1="27" x2="478" y2="27" stroke="#dce7ef" stroke-width="2" stroke-dasharray="4 4" /><text x="488" y="31" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400">Ionization limit</text><line x1="328" y1="74" x2="328" y2="155" stroke="#9e4818" stroke-width="3" /><line x1="328" y1="155" x2="322" y2="146" stroke="#9e4818" stroke-width="3" /><line x1="328" y1="155" x2="334" y2="146" stroke="#9e4818" stroke-width="3" /><text x="343" y="125" fill="#9e4818" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="650">4 → 2: emission</text></svg>