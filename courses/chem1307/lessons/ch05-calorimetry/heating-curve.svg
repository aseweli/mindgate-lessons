<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"><title>Heating curve at fixed pressure</title><desc>A rising line for warming a solid, a horizontal melting plateau, a rising liquid line, a horizontal boiling plateau, and a final rising gas line.</desc><rect x="0" y="0" width="720" height="300" fill="#ffffff" /><line x1="85" y1="245" x2="655" y2="245" stroke="#18344c" stroke-width="1.5" /><line x1="85" y1="245" x2="85" y2="31" stroke="#18344c" stroke-width="1.5" /><line x1="85" y1="31" x2="81" y2="37" stroke="#18344c" stroke-width="1.5" /><line x1="85" y1="31" x2="89" y2="37" stroke="#18344c" stroke-width="1.5" /><text x="24" y="47" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="400">Temperature</text><text x="480" y="279" fill="#18344c" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="400">Heat added to the sample</text><line x1="87" y1="177" x2="650" y2="177" stroke="#dce7ef" stroke-width="1" stroke-dasharray="4 4" /><text x="647" y="170" fill="#18344c" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="400">Melting point</text><line x1="87" y1="98" x2="650" y2="98" stroke="#dce7ef" stroke-width="1" stroke-dasharray="4 4" /><text x="647" y="91" fill="#18344c" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="400">Boiling point</text><line x1="98" y1="229" x2="161" y2="177" stroke="#117788" stroke-width="4" /><line x1="161" y1="177" x2="259" y2="177" stroke="#9e4818" stroke-width="4" /><line x1="259" y1="177" x2="347" y2="98" stroke="#117788" stroke-width="4" /><line x1="347" y1="98" x2="495" y2="98" stroke="#9e4818" stroke-width="4" /><line x1="495" y1="98" x2="548" y2="54" stroke="#117788" stroke-width="4" /><text x="125" y="218" fill="#117788" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600">Solid</text><text x="210" y="164" fill="#9e4818" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600">Melting</text><text x="300" y="150" fill="#117788" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600">Liquid</text><text x="421" y="85" fill="#9e4818" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600">Boiling</text><text x="534" y="78" fill="#117788" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600">Gas</text></svg>